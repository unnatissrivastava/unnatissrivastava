<svg width="90" height="90" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
  <circle cx="45" cy="45" r="30" fill="none" stroke="#2E2E2E" stroke-width="1"/>
  <circle cx="45" cy="45" r="4" fill="#8B8B8B"/>

  <g>
    <circle cx="45" cy="15" r="3.5" fill="#D9D9D9"/>
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 45 45"
      to="360 45 45"
      dur="6s"
      repeatCount="indefinite"/>
  </g>

  <g>
    <circle cx="45" cy="75" r="2.5" fill="#6E6E6E"/>
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="360 45 45"
      to="0 45 45"
      dur="9s"
      repeatCount="indefinite"/>
  </g>
</svg>
